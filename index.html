<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliação de Propostas Estruturantes — AVANÇA SC</title>
<meta name="robots" content="noindex, nofollow">
<style>
  #avsc-root, #avsc-root * { box-sizing: border-box; }
  #avsc-root {
    --paper: #F5F2E9;
    --ink: #1C2B22;
    --ink-soft: #5B6459;
    --panel: #FFFFFF;
    --line: #E1DCC8;
    --green: #2F6B44;
    --green-soft: #E3EEE3;
    --gold: #96762C;
    --gold-soft: #F1E8D2;
    --red: #A23B32;
    --red-soft: #F5E2DF;
    --amber: #B08A2E;
    --amber-soft: #F3ECD8;
    --navy: #1F3A5A;
    font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 0;
    position: relative;
  }
  #avsc-root .serif { font-family: 'Fraunces', Georgia, serif; }

  /* ---------- shell ---------- */
  .avsc-shell { max-width: 1180px; margin: 0 auto; padding: 22px 24px 80px; }
  .avsc-topbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding-bottom: 16px; margin-bottom: 0; flex-wrap: wrap; gap: 18px;
  }
  .avsc-brand { display: flex; align-items: center; gap: 10px; padding-top: 4px; }
  .avsc-brand .mark {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 13px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--green);
    border: 1px solid var(--green); padding: 5px 9px; border-radius: 4px;
  }
  .avsc-brand h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .avsc-brand .sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .avsc-id-box { display: flex; gap: 14px; flex-wrap: wrap; }
  .avsc-id-field { min-width: 190px; }
  .avsc-id-field label {
    display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; margin-bottom: 5px; color: var(--ink);
  }
  .avsc-id-field input {
    width: 100%; padding: 8px 11px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 13px; font-family: inherit; background: #FCFBF7; color: var(--ink);
  }
  .avsc-id-field input::placeholder { color: #A7AC9B; }
  .avsc-id-field input:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: var(--green); }
  .avsc-id-field input.warn { border-color: var(--red); }
  .avsc-id-static {
    padding: 8px 0 2px; font-size: 14px; font-weight: 700; color: var(--ink);
  }
  .avsc-id-logout { display: flex; flex-direction: column; justify-content: flex-end; }
  .avsc-id-logout .avsc-btn { padding: 8px 14px; font-size: 12.5px; }

  /* ---------- Login: fundo com foto + overlay ---------- */
  .avsc-login-bg {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    background-image: url('Campanha_JM.jpeg');
    background-size: cover; background-position: center center; background-repeat: no-repeat;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    z-index: 0;
  }
  .avsc-login-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(15,25,20,.72) 0%, rgba(28,43,34,.55) 50%, rgba(10,18,14,.80) 100%);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .avsc-login-gate {
    position: relative; z-index: 1; width: 100%; max-width: 440px;
    background: rgba(255,255,255,.92); border: 1px solid rgba(255,255,255,.6);
    border-radius: 16px; padding: 42px 36px;
    box-shadow: 0 20px 40px rgba(0,0,0,.25), 0 1px 3px rgba(0,0,0,.1);
    animation: avscLoginFadeIn .5s ease-out forwards;
  }
  @keyframes avscLoginFadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .avsc-login-eyebrow {
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--green);
    font-weight: 700; margin-bottom: 16px; display: block;
  }
  .avsc-login-gate h2 { font-family: 'Fraunces', serif; font-size: 24px; margin: 0 0 10px; line-height: 1.25; }
  .avsc-login-desc { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 26px; line-height: 1.5; }
  .avsc-login-error {
    background: var(--red-soft); color: var(--red); border: 1px solid var(--red); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; margin-bottom: 18px;
  }
  .avsc-login-gate .avsc-field label {
    text-transform: uppercase; letter-spacing: .03em; font-size: 12px;
  }
  .avsc-login-gate .avsc-field input {
    padding: 11px 14px; border-radius: 8px; background: #FCFBF7; transition: all .2s ease;
  }
  .avsc-login-gate .avsc-field input:focus {
    outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(47,107,68,.18); background: #FFFFFF;
  }
  .avsc-login-gate .avsc-btn {
    border-radius: 8px; padding: 13px 20px; font-size: 14.5px;
    box-shadow: 0 4px 12px rgba(47,107,68,.25); transition: background .2s ease, transform .1s ease;
  }
  .avsc-login-gate .avsc-btn:active { transform: scale(.99); }
  .avsc-login-footer {
    margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--ink-soft); text-align: center;
  }
  .avsc-id-warn { font-size: 10.5px; color: var(--red); margin-top: 4px; }

  .avsc-hr { border: none; border-top: 2px solid var(--ink); margin: 16px 0 22px; }

  .avsc-connbanner {
    background: var(--red-soft); border: 1px solid var(--red); color: var(--red);
    border-radius: 8px; padding: 12px 16px; font-size: 12.5px; line-height: 1.5; margin-bottom: 18px;
  }
  .avsc-connbanner b { font-weight: 800; }

  /* single content box */
  .avsc-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 26px 28px 30px; min-height: 60vh;
  }
  .avsc-box-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }

  .avsc-tabs { display: flex; gap: 6px; }
  .avsc-tab {
    font-size: 12.5px; padding: 7px 13px; border: 1px solid var(--line); background: var(--paper);
    cursor: pointer; border-radius: 6px; color: var(--ink-soft); font-weight: 700;
  }
  .avsc-tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .avsc-field { margin-bottom: 14px; }
  .avsc-field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: var(--ink); }
  .avsc-field input, .avsc-field select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 14px; font-family: inherit; background: #FCFBF7;
  }
  .avsc-field input:focus, .avsc-field select:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: var(--green); }
  .avsc-btn {
    display: inline-flex; align-items: center; gap: 8px; background: var(--green); color: #fff;
    border: none; padding: 12px 20px; border-radius: 6px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .avsc-btn:hover { background: #275838; }
  .avsc-btn:disabled { background: #B9C4BA; cursor: not-allowed; }
  .avsc-btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .avsc-btn.ghost:hover { border-color: var(--ink); }
  .avsc-btn.wide { width: 100%; justify-content: center; }

  /* ---------- progress ---------- */
  .avsc-progress-wrap { margin-bottom: 20px; }
  .avsc-progress-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
  .avsc-progress-bar { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .avsc-progress-fill { height: 100%; background: var(--green); transition: width .4s ease; }
  .avsc-dots { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
  .avsc-dot {
    width: 26px; height: 26px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel);
    font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    color: var(--ink-soft); font-weight: 700;
  }
  .avsc-dot.done { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .avsc-dot.current { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ---------- evaluation layout ---------- */
  .avsc-eval-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 28px; align-items: start; }
  @media (max-width: 880px) { .avsc-eval-grid { grid-template-columns: 1fr; } }

  .avsc-dossier { border-right: 1px solid var(--line); padding-right: 4px; }
  @media (max-width: 880px) { .avsc-dossier { border-right: none; } }
  .avsc-dossier-head { padding: 0 0 16px; border-bottom: 1px solid var(--line); position: relative; margin-bottom: 4px; }
  .avsc-dossier-head .num { font-family: 'Fraunces', serif; font-size: 12px; color: var(--ink-soft); letter-spacing: .06em; }
  .avsc-dossier-head h2 { font-family: 'Fraunces', serif; font-size: 22px; margin: 4px 0 10px; line-height: 1.28; }
  .avsc-meta-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); }
  .avsc-meta-row span b { color: var(--ink); font-weight: 700; }
  .avsc-pill {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    background: var(--navy); color: #fff;
  }

  .avsc-canvas { padding: 6px 22px 4px 0; }
  .avsc-block { padding: 16px 0; border-bottom: 1px dashed var(--line); }
  .avsc-block:last-child { border-bottom: none; }
  .avsc-block-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .avsc-block-num {
    width: 20px; height: 20px; border-radius: 4px; background: var(--green-soft); color: var(--green);
    font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .avsc-block-num.pol { background: var(--gold-soft); color: var(--gold); }
  .avsc-block-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink); }
  .avsc-block-text { font-size: 13.5px; line-height: 1.55; color: #303B31; margin: 0; padding-left: 28px; }
  .avsc-section-label {
    font-family: 'Fraunces', serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--gold); margin: 22px 0 4px; font-weight: 600;
  }

  /* ---------- scoring panel ---------- */
  .avsc-score-panel { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 14px; }
  .avsc-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
  .avsc-card h3 { font-family: 'Fraunces', serif; font-size: 14px; margin: 0 0 4px; }
  .avsc-card .card-sub { font-size: 11.5px; color: var(--ink-soft); margin: 0 0 14px; }

  .avsc-crit { margin-bottom: 16px; }
  .avsc-crit:last-child { margin-bottom: 0; }
  .avsc-crit-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .avsc-crit-name { font-size: 12.5px; font-weight: 700; }
  .avsc-crit-weight { font-size: 10.5px; color: var(--ink-soft); }
  .avsc-crit-row { display: flex; align-items: center; gap: 10px; }
  .avsc-crit input[type=range] { flex: 1; accent-color: var(--green); }
  .avsc-crit-val {
    width: 30px; text-align: center; font-weight: 800; font-size: 13px; font-family: 'Fraunces', serif;
  }
  .avsc-crit-zone { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; margin-top: 3px; }
  .avsc-crit-zone.baixa { color: var(--red); }
  .avsc-crit-zone.media { color: var(--amber); }
  .avsc-crit-zone.alta { color: var(--green); }

  .avsc-tech .avsc-crit input[type=range] { accent-color: var(--green); }
  .avsc-pol .avsc-crit input[type=range] { accent-color: var(--gold); }

  /* stamp */
  .avsc-stamp-card { text-align: center; padding: 20px; }
  .avsc-stamp {
    display: inline-block; border: 3px solid var(--ink); border-radius: 8px; padding: 10px 22px;
    transform: rotate(-3deg); font-family: 'Fraunces', serif; font-weight: 700;
  }
  .avsc-stamp.alta { border-color: var(--green); color: var(--green); }
  .avsc-stamp.media { border-color: var(--amber); color: var(--amber); }
  .avsc-stamp.baixa { border-color: var(--red); color: var(--red); }
  .avsc-stamp .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; display: block; }
  .avsc-stamp .val { font-size: 26px; display: block; }
  .avsc-formula { font-size: 11px; color: var(--ink-soft); margin-top: 10px; }
  .avsc-subscores { display: flex; justify-content: center; gap: 18px; margin-top: 12px; font-size: 12px; }
  .avsc-subscores div b { display: block; font-family: 'Fraunces', serif; font-size: 17px; }

  .avsc-save-bar { display: flex; gap: 10px; }

  /* ---------- ranking view ---------- */
  .avsc-rank-table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .avsc-rank-table th, .avsc-rank-table td { padding: 12px 14px; text-align: left; font-size: 12.5px; border-bottom: 1px solid var(--line); }
  .avsc-rank-table th { background: var(--ink); color: var(--paper); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .avsc-rank-table tr:last-child td { border-bottom: none; }
  .avsc-badge { font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; }
  .avsc-badge.alta { background: var(--green-soft); color: var(--green); }
  .avsc-badge.media { background: var(--amber-soft); color: var(--amber); }
  .avsc-badge.baixa { background: var(--red-soft); color: var(--red); }
  .avsc-badge.pendente { background: var(--line); color: var(--ink-soft); }
  .avsc-empty-note { font-size: 12px; color: var(--ink-soft); padding: 30px; text-align: center; }

  .avsc-done-screen { text-align: center; padding: 60px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .avsc-done-screen .big { font-family: 'Fraunces', serif; font-size: 30px; margin-bottom: 8px; }
  .avsc-done-screen p { color: var(--ink-soft); font-size: 14px; margin-bottom: 22px; }

  /* ---------- V2: canvas grid (fiel ao layout original) ---------- */
  .avsc-canvas-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .avsc-canvas-title h3 { font-family: 'Fraunces', serif; font-size: 17px; margin: 0; }
  .avsc-canvas-title .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 700; }
  .avsc-canvas-sub { font-size: 12px; color: var(--ink-soft); margin: 0 0 14px; }

  .avsc-canvasgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 26px; }
  @media (max-width: 1080px) { .avsc-canvasgrid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 680px) { .avsc-canvasgrid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 460px) { .avsc-canvasgrid { grid-template-columns: 1fr; } }

  .avsc-polgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 780px) { .avsc-polgrid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 460px) { .avsc-polgrid { grid-template-columns: 1fr; } }

  .avsc-tile {
    border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #fff;
    display: flex; flex-direction: column;
  }
  .avsc-tile-head { padding: 11px 12px 9px; color: #fff; }
  .avsc-tile-num {
    width: 24px; height: 24px; border-radius: 6px; background: rgba(255,255,255,.24);
    display: flex; align-items: center; justify-content: center; font-weight: 800;
    font-family: 'Fraunces', serif; font-size: 12.5px; margin-bottom: 7px;
  }
  .avsc-tile-title { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; line-height: 1.28; }
  .avsc-tile-body { padding: 10px 12px 12px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .avsc-tile-q { font-size: 10.5px; color: var(--ink-soft); font-style: italic; line-height: 1.35; margin: 0; }
  .avsc-tile-text { font-size: 11.5px; line-height: 1.5; color: #303B31; flex: 1; margin: 0; }
  .avsc-tile-classify { border-top: 1px dashed var(--line); padding-top: 9px; margin-top: auto; }
  .avsc-tile-classify-top { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .avsc-tile-classify-label { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); font-weight: 700; }
  .avsc-tile-weight { font-size: 9px; color: var(--ink-soft); font-weight: 700; }
  .avsc-chip-row { display: flex; gap: 5px; }
  .avsc-chip {
    flex: 1; text-align: center; font-size: 9.5px; font-weight: 800; padding: 6px 0; border-radius: 5px;
    border: 1px solid var(--line); cursor: pointer; background: #FBFAF6; color: var(--ink-soft);
  }
  .avsc-chip:hover { border-color: var(--ink-soft); }
  .avsc-chip.selected.baixa { background: var(--red); border-color: var(--red); color: #fff; }
  .avsc-chip.selected.media { background: var(--amber); border-color: var(--amber); color: #fff; }
  .avsc-chip.selected.alta { background: var(--green); border-color: var(--green); color: #fff; }
  .avsc-tile-noscore {
    font-size: 9.5px; color: var(--ink-soft); font-style: italic; padding-top: 9px;
    border-top: 1px dashed var(--line); margin-top: auto;
  }

  .avsc-scorebar {
    position: sticky; bottom: 14px; margin-top: 22px; background: var(--ink); color: var(--paper);
    border-radius: 10px; padding: 14px 22px; display: flex; align-items: center; justify-content: space-between;
    gap: 18px; flex-wrap: wrap; box-shadow: 0 6px 18px rgba(28,43,34,.25);
  }
  .avsc-scorebar .scores { display: flex; gap: 24px; align-items: center; }
  .avsc-scorebar .scores > div { text-align: center; }
  .avsc-scorebar .scores b { display: block; font-family: 'Fraunces', serif; font-size: 19px; }
  .avsc-scorebar .scores span.lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
  .avsc-stamp-mini {
    padding: 5px 13px; border-radius: 20px; font-weight: 800; font-size: 11px; text-transform: uppercase;
    letter-spacing: .03em;
  }
  .avsc-stamp-mini.alta { background: var(--green); color: #fff; }
  .avsc-stamp-mini.media { background: var(--amber); color: #1C2B22; }
  .avsc-stamp-mini.baixa { background: var(--red); color: #fff; }
  .avsc-scorebar-actions { display: flex; align-items: center; gap: 14px; }
  .avsc-scorebar button.savebtn {
    background: #fff; color: var(--ink); border: none; padding: 11px 20px; border-radius: 6px;
    font-weight: 800; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  .avsc-scorebar button.savebtn:disabled { opacity: .6; cursor: not-allowed; }
</style>

<div id="avsc-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

/* ================================================================
   CONFIGURAÇÃO — arquivo de dados das propostas
   O nome abaixo aponta para o arquivo propostas.json que deve estar
   NA MESMA PASTA deste index.html, no repositório do GitHub.
   Pode renomear o arquivo (ex: "dados-x7f2.json") para dificultar
   achar por acaso — só troque o nome nas duas pontas.
   ================================================================ */
const DATA_URL = "propostas.json";

/* ================================================================
   CONFIGURAÇÃO — endereço da Planilha (via Google Apps Script)
   onde as avaliações são gravadas. Siga o guia em apps_script.gs
   para criar e publicar, depois cole a URL abaixo (termina em /exec).
   ================================================================ */
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbzB-sFHT1VCg_QH0PYwoHR7TL7aDj-EZHXqO3Tlc43BIw8BQr4s0Vabcx8iehUjb0_v/exec";

/* ================================================================
   CONFIGURAÇÃO — usuários com acesso (login simples, e-mail + senha)
   IMPORTANTE: isto é uma barreira de cortesia, não segurança real —
   qualquer pessoa que abrir "Ver código-fonte" desta página vê essa
   lista. Não use senhas sensíveis aqui. Para adicionar mais gente,
   copie uma linha e edite email/senha/nome.
   ================================================================ */
const USERS = [
  { email: "avaliador1@gmail.gov.br", password: "tech26", name: "Avaliador 1" },

const TECH_WEIGHT_BY_KEY = Object.fromEntries(TECH_CRITERIA.map(c => [c.key, c.weight]));
const POL_WEIGHT_BY_KEY = Object.fromEntries(POL_CRITERIA.map(c => [c.key, c.weight]));


function zoneOf(v) {
  if (v >= 7) return "alta";
  if (v >= 5) return "media";
  return "baixa";
}
function zoneLabel(z) {
  return z === "alta" ? "Alta" : z === "media" ? "Média" : "Baixa";
}
function weightedScore(values, criteria) {
  let sum = 0;
  criteria.forEach(c => { sum += (values[c.key] ?? 5) * c.weight; });
  return sum / 100;
}
function defaultScores(criteria) {
  const o = {};
  criteria.forEach(c => o[c.key] = 6);
  return o;
}

/* ============ PLANILHA (GOOGLE SHEETS) HELPERS ============ */
// Busca todas as linhas da planilha e remonta o formato
// { proposalId: { evaluatorName: { tech, pol, org, ts } } } usado pela UI.
async function fetchAllEvaluations() {
  const isConfigured = SHEETS_URL.startsWith("http");
  if (!isConfigured) return { data: {}, error: "not_configured" };
  try {
    const res = await fetch(SHEETS_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    const result = {};
    rows.forEach(row => {
      if (!row.proposal_id || !row.evaluator_name) return;
      if (!result[row.proposal_id]) result[row.proposal_id] = {};
      let tech = {}, pol = {};
      try { tech = JSON.parse(row.tech_scores || "{}"); } catch (e) {}
      try { pol = JSON.parse(row.pol_scores || "{}"); } catch (e) {}
      result[row.proposal_id][row.evaluator_name] = {
        tech, pol, org: row.evaluator_org || null, ts: row.updated_at,
      };
    });
    return { data: result, error: null };
  } catch (e) {
    return { data: {}, error: e.message || "Falha ao ler a planilha." };
  }
}

// Grava (ou atualiza) a avaliação de UM avaliador para UMA proposta.
async function upsertEvaluation({ proposalId, proposalTitulo, evaluatorName, evaluatorOrg, tech, pol }) {
  const isConfigured = SHEETS_URL.startsWith("http");
  if (!isConfigured) return { error: "not_configured" };
  try {
    const res = await fetch(SHEETS_URL, {
      method: "POST",
      // Content-Type "text/plain" evita que o navegador dispare uma
      // requisição de pré-checagem CORS (OPTIONS), que o Apps Script não trata.
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        proposal_id: proposalId,
        proposal_titulo: proposalTitulo,
        evaluator_name: evaluatorName,
        evaluator_org: evaluatorOrg || "",
        tech_scores: JSON.stringify(tech),
        pol_scores: JSON.stringify(pol),
        updated_at: new Date().toISOString(),
      }),
    });
    const json = await res.json();
    return { error: json.ok ? null : (json.error || "Erro ao salvar.") };
  } catch (e) {
    return { error: e.message || "Falha ao gravar na planilha." };
  }
}

/* Busca as propostas do arquivo propostas.json em vez de tê-las fixas no código. */
async function fetchProposals() {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    return { data, error: null };
  } catch (e) {
    return { data: [], error: e.message || "Falha ao buscar propostas.json." };
  }
}

function App({ loggedUser, onLogout }) {
  const [ready, setReady] = useState(false);
  const [dataError, setDataError] = useState(null);
  const [evalError, setEvalError] = useState(null);
  const [PROPOSALS, setPROPOSALS] = useState([]);
  const [tab, setTab] = useState("avaliar"); // avaliar | rank
  const [orgInput, setOrgInput] = useState("");
  const [allEvals, setAllEvals] = useState({}); // { proposalId: { evaluatorName: {tech:{}, pol:{}} } }
  const [currentIdx, setCurrentIdx] = useState(0);
  const [techVals, setTechVals] = useState(defaultScores(TECH_CRITERIA));
  const [polVals, setPolVals] = useState(defaultScores(POL_CRITERIA));
  const [saving, setSaving] = useState(false);

  const evaluatorName = loggedUser.name;

  useEffect(() => {
    (async () => {
      const [evalResult, propsResult] = await Promise.all([
        fetchAllEvaluations(),
        fetchProposals(),
      ]);
      setAllEvals(evalResult.data || {});
      setEvalError(evalResult.error);
      setPROPOSALS(propsResult.data || []);
      setDataError(propsResult.error);
      setReady(true);
    })();
  }, []);

  const myDoneIds = useMemo(() => {
    if (!evaluatorName) return new Set();
    const s = new Set();
    Object.entries(allEvals).forEach(([pid, evaluators]) => {
      if (evaluators[evaluatorName]) s.add(pid);
    });
    return s;
  }, [allEvals, evaluatorName]);

  const nextPendingIdx = useMemo(() => {
    for (let i = 0; i < PROPOSALS.length; i++) {
      if (!myDoneIds.has(PROPOSALS[i].id)) return i;
    }
    return -1;
  }, [myDoneIds]);

  // whenever the evaluator name changes, jump to their first pending proposal
  // and load whatever they may have already saved for the current proposal
  useEffect(() => {
    if (!ready) return;
    const idx = nextPendingIdx === -1 ? Math.max(0, PROPOSALS.length - 1) : nextPendingIdx;
    setCurrentIdx(idx);
    loadCriteriaFor(idx);
    // eslint-disable-next-line
  }, [evaluatorName, ready]);

  function loadCriteriaFor(idx) {
    const pid = PROPOSALS[idx].id;
    const existing = evaluatorName && allEvals[pid] && allEvals[pid][evaluatorName];
    setTechVals(existing ? existing.tech : defaultScores(TECH_CRITERIA));
    setPolVals(existing ? existing.pol : defaultScores(POL_CRITERIA));
  }

  const proposal = PROPOSALS[currentIdx];

  const techScore = useMemo(() => weightedScore(techVals, TECH_CRITERIA), [techVals]);
  const polScore = useMemo(() => weightedScore(polVals, POL_CRITERIA), [polVals]);
  const finalScore = useMemo(() => (techScore * 2 + polScore * 3) / 5, [techScore, polScore]);
  const finalZone = zoneOf(finalScore);

  async function saveAndNext() {
    setSaving(true);
    const pid = proposal.id;
    const { error } = await upsertEvaluation({
      proposalId: pid, proposalTitulo: proposal.titulo,
      evaluatorName, evaluatorOrg: orgInput, tech: techVals, pol: polVals,
    });
    if (error) { setEvalError(error); setSaving(false); return; }
    setEvalError(null);

    const updated = { ...allEvals };
    updated[pid] = { ...(updated[pid] || {}) };
    updated[pid][evaluatorName] = {
      tech: techVals, pol: polVals,
      org: orgInput || null,
      ts: new Date().toISOString(),
    };
    setAllEvals(updated);

    // find next pending for this evaluator
    let nextIdx = -1;
    for (let i = 0; i < PROPOSALS.length; i++) {
      const evals = updated[PROPOSALS[i].id];
      if (!evals || !evals[evaluatorName]) { nextIdx = i; break; }
    }
    setSaving(false);
    if (nextIdx === -1) { setCurrentIdx(PROPOSALS.length - 1); }
    else {
      setCurrentIdx(nextIdx);
      const pid2 = PROPOSALS[nextIdx].id;
      const existing = updated[pid2] && updated[pid2][evaluatorName];
      setTechVals(existing ? existing.tech : defaultScores(TECH_CRITERIA));
      setPolVals(existing ? existing.pol : defaultScores(POL_CRITERIA));
    }
  }

  function jumpTo(idx) {
    setCurrentIdx(idx);
    loadCriteriaFor(idx);
    setTab("avaliar");
  }

  const doneCount = myDoneIds.size;
  const totalCount = PROPOSALS.length;

  /* ---------- ranking data ---------- */
  const rankingRows = useMemo(() => {
    return PROPOSALS.map(p => {
      const evaluators = allEvals[p.id] || {};
      const names = Object.keys(evaluators);
      if (names.length === 0) {
        return { proposal: p, nEval: 0, tech: null, pol: null, final: null, zone: null };
      }
      let techSum = 0, polSum = 0;
      names.forEach(n => {
        techSum += weightedScore(evaluators[n].tech, TECH_CRITERIA);
        polSum += weightedScore(evaluators[n].pol, POL_CRITERIA);
      });
      const techAvg = techSum / names.length;
      const polAvg = polSum / names.length;
      const finalAvg = (techAvg * 2 + polAvg * 3) / 5;
      return { proposal: p, nEval: names.length, tech: techAvg, pol: polAvg, final: finalAvg, zone: zoneOf(finalAvg) };
    }).sort((a, b) => (b.final ?? -1) - (a.final ?? -1));
  }, [allEvals]);

  if (!ready) {
    return <div style={{padding: 60, textAlign: "center", color: "var(--ink-soft)"}}>Carregando…</div>;
  }

  const allDone = evaluatorName && nextPendingIdx === -1;

  return (

          <div>
            <h1 className="serif">Avaliação de Propostas Estruturantes</h1>
            <div className="sub">Etapas 4 e 5 da metodologia · Classificação Técnica e Política</div>
          </div>
        </div>

            <label>Avaliador</label>
            <div className="avsc-id-static">{loggedUser.name}</div>
          </div>
          <div className="avsc-id-field">
            <label>Órgão / área (opcional)</label>
            <input value={orgInput} onChange={e => setOrgInput(e.target.value)} placeholder="Ex: Casa Civil" />
          </div>
          <div className="avsc-id-field avsc-id-logout">
            <label>&nbsp;</label>
            <button className="avsc-btn ghost" onClick={onLogout}>Sair</button>
          </div>
        </div>
      </div>
      <hr className="avsc-hr" />

      {dataError && (
        <div className="avsc-connbanner">
          <b>Não foi possível carregar as propostas.</b> Confira se o arquivo propostas.json está na
          mesma pasta deste index.html no repositório. Detalhe técnico: {dataError}
        </div>
      )}

      {evalError === "not_configured" && (
        <div className="avsc-connbanner">
          <b>Planilha de avaliações não configurada.</b> Edite o index.html e preencha SHEETS_URL
          no topo do bloco &lt;script&gt; com a URL do seu Apps Script (veja apps_script.gs).
          Até lá, as notas não serão salvas entre sessões.
        </div>
      )}
      {evalError && evalError !== "not_configured" && (
        <div className="avsc-connbanner">
          <b>Não foi possível salvar/carregar as avaliações.</b> Detalhe técnico: {evalError}
        </div>
      )}

      <div className="avsc-box">
        <div className="avsc-box-head">
          <div className="avsc-tabs">
            <button className={"avsc-tab " + (tab === "avaliar" ? "active" : "")} onClick={() => setTab("avaliar")}>Avaliar</button>
            <button className={"avsc-tab " + (tab === "rank" ? "active" : "")} onClick={() => setTab("rank")}>Ranking consolidado</button>
          </div>
          {tab === "avaliar" && evaluatorName && (
            <span style={{fontSize: 12, color: "var(--ink-soft)"}}>
              {doneCount} de {totalCount} avaliadas por {evaluatorName}
            </span>
          )}
        </div>

        {tab === "avaliar" && PROPOSALS.length === 0 && !dataError && (
          <div className="avsc-empty-note">Nenhuma proposta retornada pelo Worker.</div>
        )}

        {tab === "avaliar" && !allDone && proposal && (
          <React.Fragment>
            <div className="avsc-progress-wrap">
              <div className="avsc-progress-top">
                <span>Proposta {currentIdx + 1} de {totalCount}</span>
                <span>{Math.round((doneCount/totalCount)*100)}%</span>
              </div>
              <div className="avsc-progress-bar"><div className="avsc-progress-fill" style={{width: `${(doneCount/totalCount)*100}%`}}></div></div>
              <div className="avsc-dots">
                {PROPOSALS.map((p, i) => (
                  <div key={p.id}
                       className={"avsc-dot " + (i === currentIdx ? "current" : myDoneIds.has(p.id) ? "done" : "")}
                       onClick={() => jumpTo(i)} title={p.titulo}>
                    {myDoneIds.has(p.id) && i !== currentIdx ? "✓" : p.numero}

                  <td>{r.pol !== null ? r.pol.toFixed(1) : "—"}</td>
                  <td>{r.final !== null ? <b>{r.final.toFixed(1)}</b> : "—"}</td>
                  <td>{r.zone ? <span className={"avsc-badge " + r.zone}>{zoneLabel(r.zone)}</span> : <span className="avsc-badge pendente">Pendente</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ================================================================
   LOGIN — barreira simples de e-mail + senha (ver USERS no topo)
   ================================================================ */
function Login({ onSuccess }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  function handleSubmit(e) {
    e.preventDefault();
    const match = USERS.find(
      u => u.email.trim().toLowerCase() === email.trim().toLowerCase() && u.password === password
    );
    if (!match) {
      setError("E-mail ou senha inválidos.");
      return;
    }
    sessionStorage.setItem("avsc_user", JSON.stringify({ email: match.email, name: match.name }));
    onSuccess(match);
  }

  return (
    <div className="avsc-login-bg">
      <div className="avsc-login-overlay"></div>
      <div className="avsc-login-gate">
        <span className="avsc-login-eyebrow">Acesso restrito</span>
        <h2 className="serif">Avaliação de Propostas Estruturantes</h2>
        <p className="avsc-login-desc">Entre com o e-mail e a senha que foram compartilhados com você.</p>
        <form onSubmit={handleSubmit}>
          <div className="avsc-field">
            <label>E-mail</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                   placeholder="seuemail@sc.gov.br" autoFocus />
          </div>
          <div className="avsc-field">
            <label>Senha</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                   placeholder="••••••••" />
          </div>
          {error && <div className="avsc-login-error">{error}</div>}
          <button type="submit" className="avsc-btn wide">Entrar no Sistema →</button>
        </form>
        <div className="avsc-login-footer">Governo do Estado de Santa Catarina — 2026</div>
      </div>
    </div>
  );
}

function Gate() {
  const [user, setUser] = useState(undefined); // undefined = checking, null = logged out, object = logged in

  useEffect(() => {
    try {
      const raw = sessionStorage.getItem("avsc_user");
      setUser(raw ? JSON.parse(raw) : null);
    } catch (e) {
      setUser(null);
    }
  }, []);

  if (user === undefined) return null;
  if (!user) return <Login onSuccess={setUser} />;

  function handleLogout() {
    sessionStorage.removeItem("avsc_user");
    setUser(null);
  }

  return <App loggedUser={user} onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById('avsc-root')).render(<Gate />);
</script>

</body>
